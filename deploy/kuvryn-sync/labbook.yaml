# Kuvryn Sync keeps labbook on kw in step with main: the Repository follows the Git
# branch and the Application renders deploy/helm/labbook with values-kw.yaml. CI
# writes each new image tag into values-kw.yaml after the image is pushed (as in
# kuvryn-scout), so a green build on main rolls out by itself.
# Applied once by hand:  kubectl --context kw apply -f deploy/kuvryn-sync/labbook.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuvryn-sync-deployer
  namespace: labbook
---
# What the chart renders, and what health checks read; nothing cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuvryn-sync-deployer
  namespace: labbook
rules:
  - apiGroups: ['']
    resources: [services, serviceaccounts, persistentvolumeclaims, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, events, secrets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuvryn-sync-deployer
  namespace: labbook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuvryn-sync-deployer
subjects:
  - kind: ServiceAccount
    name: kuvryn-sync-deployer
    namespace: labbook
---
apiVersion: sync.kuvryn.io/v1alpha1
kind: Repository
metadata:
  name: labbook
  namespace: labbook
spec:
  type: git
  git:
    url: https://github.com/azrtydxb/labbook.git
    revision: main
  pollInterval: 60s
---
apiVersion: sync.kuvryn.io/v1alpha1
kind: Application
metadata:
  name: labbook
  namespace: labbook
spec:
  destination:
    namespace: labbook
  serviceAccountName: kuvryn-sync-deployer
  deletionPolicy: Orphan
  source:
    repositoryRef:
      name: labbook
    revision: main
    path: deploy/helm/labbook
    render:
      type: helm
      helm:
        releaseName: labbook
        valuesFiles: [values-kw.yaml]
  health:
    timeout: 10m
  history:
    limit: 10
  strategy:
    type: rolling
    failurePolicy:
      action: rollback
      maxAttempts: 2
      timeout: 10m
  sync:
    automatic: true
    # The live objects were created by kubectl apply -k; adopt them in place.
    conflictPolicy: adopt
    prune: true
    selfHeal: true
