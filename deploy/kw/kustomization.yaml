# labbook on kw. The per-app Postgres (postgres.yaml) and its logical pg_dump CronJob
# (backup.yaml) were retired when labbook moved onto the shared-pg cluster, which backs
# the database up hourly with the barman plugin (7-day retention + PITR); app.yaml went
# with them because it still named the retired cluster's secret. kuvryn-sync renders
# deploy/helm/labbook for the workload, so what remains here is the namespace + ingress.
# Apply:  kubectl --context kw apply -k deploy/kw
# The admin Secret is not in the repo; README.md "Deploy" creates it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: labbook
resources:
  - namespace.yaml
  - ingress.yaml
images:
  # Pinned by digest; update from the CI run's summary (never a moving tag).
  - name: labbook
    newName: ant.kw.watteel.lab/oci-hosted/azrtydxb/labbook
    digest: sha256:4bfe46cd5bc2e2515fb4523619c4e987c83669dd0cefec2eb008f7158011ed49
