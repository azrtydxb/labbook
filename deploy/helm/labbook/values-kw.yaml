# kw overrides. Kuvryn Sync renders the chart with this file as release `labbook` in the
# `labbook` namespace. The namespace and the labbook-admin Secret exist beforehand.
#
# image.tag is written by CI after the image is pushed and proven pullable (as in
# kuvryn-scout), so the tag kw runs is a fact in Git. Do not edit it by hand: the
# next build overwrites it.
image:
  repository: ant.kw.watteel.lab/oci-hosted/azrtydxb/labbook
  tag: 'sha-acdd6ef' # managed by CI

replicas: 2

admin:
  secretName: labbook-admin

database:
  # Consolidated on the shared-pg cluster; the URI Secret is applied out of band.
  secretName: labbook-db-shared

ingress:
  enabled: true
  className: nginx
  # *.kw.watteel.lab resolves to the ingress-nginx LoadBalancer 192.168.10.120.
  host: labbook.kw.watteel.lab
  tls:
    secretName: labbook-tls
    certificate:
      enabled: true
      issuerKind: ClusterIssuer
      issuerName: cluster-ca

postgresql:
  # Consolidated on the shared-pg cluster (internal-lab/kubernetes/shared-pg).
  enabled: false
  # Two instances on different nodes, one Longhorn replica each (CNPG already replicates).
  instances: 2
  inheritedMetadata:
    labels:
      # Longhorn syncs recurring-job labels from the PVC to its volume: the daily
      # `critical` backup to the NAS.
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/critical: enabled
  storage:
    size: 10Gi
    storageClass: longhorn-single

backups:
  # Retired: labbook's database moved to the shared-pg cluster, where the barman
  # plugin archives WAL continuously and takes hourly base backups (7-day retention,
  # PITR), so this second, per-app logical dump is no longer maintained. It had been
  # failing since the move anyway -- the job reads username/password/dbname keys but
  # the shared secret carries only a `uri` -- 2133 CreateContainerConfigError retries
  # in 8 hours. keepData is true, so the dumps PVC is still rendered and the volume
  # stays reachable.
  enabled: false
  schedule: '17 */6 * * *'
  retentionDays: 30
  # TrueNAS NFS; after the first bind, set the PV's reclaim policy to Retain.
  storage:
    size: 20Gi
    storageClass: truenas-nfs
