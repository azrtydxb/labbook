# Test on the arm64 ARC runners (npm through Kuvryn Ant via azrtydxb/ant-setup-action),
# then build and push the arm64 image to Kuvryn Ant (ant.azrty.com/oci-hosted, GitHub
# OIDC login, no stored secret); kw replicates it.
# Adapted from internal-lab/templates/workflows/{node,container-image}.yml; read
# internal-lab/AGENTS.md before changing runner labels, registries or the CA step.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Integration tier: the Postgres-backed suite, nightly. Pull requests run the
  # hermetic unit suite only (see the `test` job).
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: write-all

jobs:
  # Unit tier (required check `test`): format, lint, typecheck, the hermetic
  # unit suite (evaluate/openapi — no database) and the build. No Postgres here;
  # the database-backed suite runs in the `integration` job (nightly).
  test:
    runs-on: arc-azrtydxb
    timeout-minutes: 30
    # The runner image has no node; the Dockerfile uses the same base image.
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@549f7472cf26b0885441ed9f9a7fab0277545000 # v1

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  # Integration tier: the Postgres-backed API and baseline suites against the
  # service container. Not a required check and never on a pull request.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: arc-azrtydxb
    timeout-minutes: 30
    container:
      image: node:22-bookworm-slim
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci@postgres:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@549f7472cf26b0885441ed9f9a7fab0277545000 # v1

      - run: npm ci --no-audit --no-fund
      - run: npm run test:integration

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: arc-azrtydxb
    timeout-minutes: 60
    # Pushes the "Deploy sha-… to kw" commit that Kuvryn Sync rolls out.
    permissions:
      contents: write
      id-token: write
    env:
      PUSH_REGISTRY: ant.azrty.com/oci-hosted
      IMAGE: ant.azrty.com/oci-hosted/azrtydxb/labbook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@549f7472cf26b0885441ed9f9a7fab0277545000 # v1

      - name: Compute tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            [ "${GITHUB_REF_TYPE}" = "tag" ] && echo "${IMAGE}:${GITHUB_REF_NAME#v}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        run: |
          cat > /tmp/buildkitd.toml <<'EOF'
          [registry."192.168.10.131"]
            insecure = true
          [registry."192.168.10.131:5000"]
            insecure = true
          [registry."docker.io"]
            mirrors = ["ant.azrty.com"]
          [registry."gcr.io"]
            mirrors = ["ant.azrty.com"]
          EOF
          docker buildx create --name builder --driver docker-container \
            --platform linux/arm64 --buildkitd-config /tmp/buildkitd.toml --use
          docker buildx inspect --bootstrap

      - id: ant
        uses: azrtydxb/ant-setup-action@549f7472cf26b0885441ed9f9a7fab0277545000 # v1
        with:
          build-cache: "true"
          cache-name: labbook
          docker-login: 'true'
          required: 'true'
          go: 'false'
          cargo: 'false'
          pip: 'false'

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          builder: builder
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: ${{ steps.ant.outputs.cache-from }}
          cache-to: ${{ steps.ant.outputs.cache-to }}
          provenance: false
          sbom: false

      - name: Digest
        run: |
          echo "pushed ${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "deploy (kw): ant.kw.watteel.lab/oci-hosted/azrtydxb/labbook@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # The image must resolve on the authoritative Ant before kw is told to run
      # it; kw replicates oci-hosted (30 s poll) and its nodes rewrite the chart's
      # 192.168.10.131/azrtydxb/labbook name to that replica. The pause below gives
      # replication a head start before the deploy commit lands. (Same as kuvryn-scout.)
      - name: The pushed tag resolves
        run: |
          tag="sha-${GITHUB_SHA::7}"
          for _ in $(seq 1 30); do
            # imagetools, not `docker manifest inspect`: Ant answers 406 unless the
            # Accept header lists the OCI media type the image was pushed with.
            if docker buildx imagetools inspect --raw "${IMAGE}:${tag}" >/dev/null 2>&1; then
              echo "${IMAGE}:${tag} resolves"
              if [ "${GITHUB_REF}" = "refs/heads/main" ]; then sleep 60; fi
              exit 0
            fi
            sleep 4
          done
          echo "pushed to ${PUSH_REGISTRY} but ${IMAGE}:${tag} does not resolve" >&2
          exit 1

      # The tag kw should run becomes a fact in Git; Kuvryn Sync watches main and
      # converges the cluster on it. [skip ci] keeps this commit from building
      # itself. Rebuilt from origin on every attempt (a rebase of two builds
      # rewriting the same line is a conflict the loop cannot resolve), and never
      # moves the cluster backwards past a newer recorded build.
      - name: Record the image tag for the cluster
        if: github.ref == 'refs/heads/main'
        env:
          VALUES: deploy/helm/labbook/values-kw.yaml
          DEPLOY_KEY: ${{ secrets.LABBOOK_DEPLOY_KEY }}
        run: |
          # main's ruleset lets a deploy key bypass the required "test" check,
          # which the GitHub Actions token cannot be granted. SSH over 443 keeps
          # the push working from the runner's restricted egress.
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host github.com\n  HostName ssh.github.com\n  Port 443\n  User git\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config

          TAG="sha-${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main

            # Either quote style: prettier (singleQuote) rewrites the file.
            current=$(sed -nE "s/^  tag: ['\"]([^'\"]*)['\"].*/\1/p" "$VALUES" | head -1)
            if [ "$current" = "$TAG" ]; then
              echo "$VALUES already names $TAG"
              exit 0
            fi
            recorded="${current#sha-}"
            if [ -n "$recorded" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$recorded" 2>/dev/null; then
              echo "$current is newer than $TAG; leaving it alone"
              exit 0
            fi

            sed -E "/^image:/,/^[^ #]/ s|^  tag: ['\"][^'\"]*['\"]|  tag: '$TAG'|" "$VALUES" > "$VALUES.new"
            mv "$VALUES.new" "$VALUES"
            grep -q "tag: '$TAG'" "$VALUES" || { echo "failed to write $TAG into $VALUES" >&2; exit 1; }

            git config user.name "labbook ci"
            git config user.email "ci@labbook.invalid"
            git add "$VALUES"
            git commit --quiet -m "Deploy $TAG to kw [skip ci]" -m "Written by CI after the image was pushed and proven pullable."
            if git push --quiet git@github.com:${GITHUB_REPOSITORY}.git HEAD:main; then
              echo "recorded $TAG on main"
              exit 0
            fi
            echo "push rejected, rebuilding from origin (attempt $attempt)"
            sleep 5
          done
          echo "could not record $TAG on main" >&2
          exit 1
